<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <g transform="translate(80,80)">
    <!-- gear: 8 teeth, outline style -->
    <g>
      <circle r="46" fill="#FFFFFF" stroke="#1C1C1C" stroke-width="7"/>
      <g fill="#1C1C1C">
        <g transform="rotate(0)"><rect x="-8" y="-58" width="16" height="18" rx="2"/></g>
        <g transform="rotate(45)"><rect x="-8" y="-58" width="16" height="18" rx="2"/></g>
        <g transform="rotate(90)"><rect x="-8" y="-58" width="16" height="18" rx="2"/></g>
        <g transform="rotate(135)"><rect x="-8" y="-58" width="16" height="18" rx="2"/></g>
        <g transform="rotate(180)"><rect x="-8" y="-58" width="16" height="18" rx="2"/></g>
        <g transform="rotate(225)"><rect x="-8" y="-58" width="16" height="18" rx="2"/></g>
        <g transform="rotate(270)"><rect x="-8" y="-58" width="16" height="18" rx="2"/></g>
        <g transform="rotate(315)"><rect x="-8" y="-58" width="16" height="18" rx="2"/></g>
      </g>
    </g>
    <!-- wrench crossing diagonally, knocked out from the gear -->
    <g transform="rotate(-45)">
      <rect x="-72" y="-11" width="144" height="22" rx="11" fill="#FFFFFF"/>
      <rect x="-64" y="-8" width="128" height="16" rx="8" fill="#9E1B32"/>
      <circle cx="-64" cy="0" r="22" fill="#FFFFFF"/>
      <circle cx="-64" cy="0" r="22" fill="none" stroke="#9E1B32" stroke-width="11"/>
      <circle cx="64" cy="0" r="22" fill="#FFFFFF"/>
      <circle cx="64" cy="0" r="22" fill="none" stroke="#9E1B32" stroke-width="11"/>
    </g>
  </g>
</svg>
